apiVersion: apps/v1
kind: Deployment
metadata:
  name: merchant-payment-service
spec:
  replicas: 2 # Show you understand "High Availability"
  selector:
    matchLabels:
      app: payment-api
  template:
    metadata:
      labels:
        app: payment-api
    spec:
      containers:
      - name: payment-api
        image: furqan11s/merchant-payment-service:latest
        ports:
        - containerPort: 8080
        # This shows you know how GKE monitors health:
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10